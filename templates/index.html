
<!DOCTYPE html>
<html>
<head>
    <title>Student Record Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Record Management System</h1>
        <p>Manage your student records easily</p>

        <div class="form-box">
            <h2>Add New Student</h2>

            <form action="/add" method="POST">

                <input type="text" name="name" placeholder="Student Name" required>

                <input type="number" name="age" placeholder="Student Age" min="1" required>

                <input type="text" name="course" placeholder="Student Course" required>

                <button type="submit">Add Student</button>

            </form>
        </div>

        <h2>Student Records</h2>

<form action="/search" method="GET" class="search-form">
    <input
        type="text"
        name="keyword"
        placeholder="Search student by name"
    >
    <button type="submit">Search</button>
    <a href="/">Show All</a>
</form>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
            </tr>

            {% for student in students %}
<tr>
    <td>{{ student[0] }}</td>
    <td>{{ student[1] }}</td>
    <td>{{ student[2] }}</td>
    <td>{{ student[3] }}</td>

    <td>
        <form action="/update/{{ student[0] }}" method="POST">
            <input type="text" name="name"
                   value="{{ student[1] }}" required>

            <input type="number" name="age"
                   value="{{ student[2] }}" min="1" required>

            <input type="text" name="course"
                   value="{{ student[3] }}" required>

            <button type="submit">Update</button>
        </form>
        <form action="/delete/{{ student[0] }}" method="POST"
      onsubmit="return confirm('Are you sure you want to delete this student?');">

    <button type="submit" class="delete-btn">Delete</button>

</form>
    </td>
</tr>
{% endfor %}

        </table>

    </div>

</body>
</html>
